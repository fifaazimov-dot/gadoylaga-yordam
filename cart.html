<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savat va Buyurtma - MedHelp Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <header class="bg-nav bg-white/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5 text-2xl font-extrabold text-teal-600">
        <div class="w-10 h-10 rounded-xl bg-teal-600 text-white flex items-center justify-center shadow-md">
          <i class="fas fa-notes-medical text-xl"></i>
        </div>
        <span>Med<span class="text-slate-800 dark:text-white">Help</span></span>
      </a>

      <nav class="hidden md:flex items-center gap-7 font-semibold text-sm">
        <a href="index.html" class="hover:text-teal-600" data-i18n="home">Bosh sahifa</a>
        <a href="products.html" class="hover:text-teal-600" data-i18n="products">Mahsulotlar</a>
        <a href="favorites.html" class="hover:text-teal-600" data-i18n="favorites">Saralanganlar</a>
        <a href="about.html" class="hover:text-teal-600" data-i18n="about">Biz haqimizda</a>
      </nav>

      <div class="flex items-center gap-3">
        <select id="langSelect" class="border border-slate-200 dark:border-slate-700 font-semibold rounded-lg px-2 py-1 text-xs bg-slate-100 dark:bg-slate-800">
          <option value="uz">UZ</option>
          <option value="ru">RU</option>
          <option value="en">EN</option>
        </select>
        <button id="themeToggleBtn" class="w-9 h-9 rounded-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <div class="flex items-center justify-between mb-8">
      <h2 class="text-2xl sm:text-3xl font-extrabold" data-i18n="cart">Xarid Savatchasi</h2>
      <button onclick="clearCart()" class="text-xs text-red-500 font-bold hover:underline flex items-center gap-1.5" data-i18n="clearCart">
        <i class="fas fa-trash-can"></i> Savatni tozalash
      </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- MAHSULOTLAR RO'YXATI -->
      <div class="lg:col-span-2 space-y-4" id="cartContainer"></div>

      <!-- BUYURTMA FORMASI (CHECKOUT) -->
      <div class="bg-card bg-white p-6 sm:p-7 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm h-fit">
        <h3 class="text-lg font-bold mb-4 pb-3 border-b border-slate-100 dark:border-slate-800 flex items-center gap-2" data-i18n="checkoutTitle">
          <i class="fas fa-receipt text-teal-600"></i> Buyurtmani Rasmiylashtirish
        </h3>
        
        <form onsubmit="submitOrderToTelegram(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-muted mb-1" data-i18n="namePlaceholder">To'liq ism-familiyangiz</label>
            <input type="text" id="custName" required placeholder="Masalan: Abdulbosit Qodirov" class="w-full border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:ring-2 focus:ring-teal-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-muted mb-1" data-i18n="phonePlaceholder">Telefon raqam</label>
            <input type="tel" id="custPhone" required placeholder="+998 90 123 45 67" class="w-full border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:ring-2 focus:ring-teal-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-muted mb-1" data-i18n="addressPlaceholder">Yetkazib berish manzili</label>
            <textarea id="custAddress" required rows="2" placeholder="Toshkent shahar, Yunusobod tumani..." class="w-full border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:ring-2 focus:ring-teal-500"></textarea>
          </div>
          <div>
            <label class="block text-xs font-bold text-muted mb-1" data-i18n="paymentMethod">To'lov turi</label>
            <select id="custPayment" class="w-full border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2.5 text-sm bg-white dark:bg-slate-800 font-medium outline-none">
              <option value="Naqd / Terminal" data-i18n="payCash">Yetkazilganda naqd / karta</option>
              <option value="Click / Payme (Online)" data-i18n="payClick">Click / Payme (Online)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-muted mb-1" data-i18n="deliveryNotes">Qo'shimcha izoh</label>
            <input type="text" id="custNotes" placeholder="Mo'ljal yoki kirish kodi" class="w-full border border-slate-200 dark:border-slate-700 rounded-xl px-3.5 py-2 text-sm outline-none">
          </div>

          <div class="pt-4 border-t border-slate-100 dark:border-slate-800">
            <div class="flex justify-between items-center text-lg font-extrabold mb-4">
              <span data-i18n="total">Jami to'lov:</span>
              <span id="cartTotalPrice" class="text-teal-600">0 so'm</span>
            </div>
            <button type="submit" id="submitOrderBtn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-teal-600/30 transition flex items-center justify-center gap-2">
              <i class="fab fa-telegram-plane text-lg"></i>
              <span data-i18n="submitOrder">Buyurtmani Tasdiqlash (Telegram Bot)</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="bg-nav bg-white border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-muted">
    <p>&copy; 2026 MedHelp Pro.</p>
  </footer>

  <script src="app.js"></script>
  <script>
    window.renderCartPage = () => {
      const container = document.getElementById("cartContainer");
      const totalSpan = document.getElementById("cartTotalPrice");
      container.innerHTML = "";
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="bg-card bg-white p-12 rounded-2xl border border-slate-200 dark:border-slate-800 text-center">
            <i class="fas fa-cart-shopping text-5xl text-slate-300 dark:text-slate-600 mb-3 block"></i>
            <h4 class="font-bold text-lg mb-1" data-i18n="cartEmpty">${i18n[currentLang].cartEmpty}</h4>
            <p class="text-muted text-xs mb-6">Salomatlik uchun zarur buyumlarni katalogimizdan tanlang</p>
            <a href="products.html" class="bg-teal-600 text-white font-bold px-6 py-2.5 rounded-xl text-xs">
              Katalogga o'tish
            </a>
          </div>
        `;
        totalSpan.textContent = `0 ${i18n[currentLang].currency}`;
        return;
      }

      cart.forEach(item => {
        const prod = products.find(p => p.id === item.id);
        if (prod) {
          const itemTotal = prod.price * item.qty;
          total += itemTotal;
          const card = document.createElement("div");
          card.className = "bg-card bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm";
          card.innerHTML = `
            <div class="flex items-center gap-4 w-full sm:w-auto">
              <img src="${prod.image}" class="w-16 h-16 rounded-xl object-cover shrink-0">
              <div>
                <h4 class="font-bold text-sm sm:text-base">${prod.name[currentLang]}</h4>
                <p class="text-xs font-bold text-teal-600 mt-1">${prod.price.toLocaleString()} ${i18n[currentLang].currency}</p>
              </div>
            </div>
            <div class="flex items-center justify-between sm:justify-end gap-6 w-full sm:w-auto">
              <div class="flex items-center border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden">
                <button onclick="updateCartQty(${prod.id}, -1)" class="w-8 h-8 flex items-center justify-center font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition">-</button>
                <span class="w-8 text-center text-xs font-bold">${item.qty}</span>
                <button onclick="updateCartQty(${prod.id}, 1)" class="w-8 h-8 flex items-center justify-center font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition">+</button>
              </div>
              <span class="font-extrabold text-sm sm:text-base text-slate-800 dark:text-white min-w-[90px] text-right">
                ${itemTotal.toLocaleString()} ${i18n[currentLang].currency}
              </span>
              <button onclick="removeFromCart(${prod.id})" class="text-slate-400 hover:text-red-500 transition p-1">
                <i class="fas fa-trash-can text-sm"></i>
              </button>
            </div>
          `;
          container.appendChild(card);
        }
      });

      totalSpan.textContent = `${total.toLocaleString()} ${i18n[currentLang].currency}`;
    };

    window.renderPageContent = window.renderCartPage;
    document.addEventListener("DOMContentLoaded", window.renderCartPage);
  </script>
</body>
</html>
