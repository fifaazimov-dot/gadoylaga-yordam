<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saralanganlar - MedHelp Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <header class="bg-nav bg-white/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5 text-2xl font-extrabold text-teal-600">
        <div class="w-10 h-10 rounded-xl bg-teal-600 text-white flex items-center justify-center shadow-md">
          <i class="fas fa-notes-medical text-xl"></i>
        </div>
        <span>Med<span class="text-slate-800 dark:text-white">Help</span></span>
      </a>

      <nav class="hidden md:flex items-center gap-7 font-semibold text-sm">
        <a href="index.html" class="hover:text-teal-600" data-i18n="home">Bosh sahifa</a>
        <a href="products.html" class="hover:text-teal-600" data-i18n="products">Mahsulotlar</a>
        <a href="favorites.html" class="text-teal-600 font-bold" data-i18n="favorites">Saralanganlar</a>
        <a href="about.html" class="hover:text-teal-600" data-i18n="about">Biz haqimizda</a>
      </nav>

      <div class="flex items-center gap-3">
        <select id="langSelect" class="border border-slate-200 dark:border-slate-700 font-semibold rounded-lg px-2 py-1 text-xs bg-slate-100 dark:bg-slate-800">
          <option value="uz">UZ</option>
          <option value="ru">RU</option>
          <option value="en">EN</option>
        </select>
        <button id="themeToggleBtn" class="w-9 h-9 rounded-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center">
          <i class="fas fa-moon"></i>
        </button>
        <a href="cart.html" class="relative bg-teal-600 text-white px-3.5 py-2 rounded-lg font-semibold text-sm flex items-center gap-2">
          <i class="fas fa-cart-shopping"></i>
          <span id="cartCount" class="bg-white text-teal-700 font-extrabold text-xs px-1.5 py-0.2 rounded-full">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
      <div>
        <h2 class="text-2xl sm:text-3xl font-extrabold" data-i18n="favorites">Saralangan Mahsulotlar</h2>
        <p class="text-muted text-sm mt-1">Keyinroq sotib olish uchun saqlab qo'yilgan tovarlar</p>
      </div>
      <button onclick="moveAllFavoritesToCart()" class="bg-slate-800 hover:bg-slate-900 dark:bg-slate-700 dark:hover:bg-slate-600 text-white px-4 py-2.5 rounded-xl font-semibold text-xs flex items-center gap-2 transition" data-i18n="addAllFavsToCart">
        <i class="fas fa-cart-arrow-down"></i> Barchasini savatga o'tkazish
      </button>
    </div>

    <div id="favoritesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  </main>

  <footer class="bg-nav bg-white border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-muted">
    <p>&copy; 2026 MedHelp Pro.</p>
  </footer>

  <script src="app.js"></script>
  <script>
    window.renderFavoritesPage = () => {
      const grid = document.getElementById("favoritesGrid");
      grid.innerHTML = "";
      const favList = products.filter(p => favorites.includes(p.id));

      if (favList.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-20">
            <div class="w-20 h-20 bg-red-50 dark:bg-red-950/30 rounded-full flex items-center justify-center mx-auto mb-4">
              <i class="far fa-heart text-4xl text-red-400"></i>
            </div>
            <h3 class="font-bold text-lg mb-1" data-i18n="favEmpty">${i18n[currentLang].favEmpty}</h3>
            <p class="text-muted text-xs mb-6">O'zingizga yoqqan mahsulotlarga yurakcha tugmasini bosing</p>
            <a href="products.html" class="bg-teal-600 hover:bg-teal-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition">
              Mahsulotlar katalogiga o'tish
            </a>
          </div>
        `;
        return;
      }

      favList.forEach(p => {
        const card = document.createElement("div");
        card.className = "bg-card bg-white border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm flex flex-col justify-between";
        card.innerHTML = `
          <div class="relative">
            <img src="${p.image}" class="w-full h-48 object-cover">
            <button onclick="toggleFavorite(${p.id})" class="absolute top-3 right-3 bg-white/90 dark:bg-slate-900/90 w-9 h-9 rounded-full flex items-center justify-center text-red-500 shadow">
              <i class="fas fa-heart text-base"></i>
            </button>
          </div>
          <div class="p-5 flex-grow flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-base mb-1">${p.name[currentLang]}</h3>
              <p class="text-xs text-muted line-clamp-2 mb-4">${p.desc[currentLang]}</p>
            </div>
            <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
              <span class="text-base font-extrabold text-teal-600">${p.price.toLocaleString()} ${i18n[currentLang].currency}</span>
              <button onclick="addToCart(${p.id})" class="bg-teal-600 hover:bg-teal-700 text-white font-semibold text-xs px-3.5 py-2 rounded-xl flex items-center gap-1.5 transition">
                <i class="fas fa-cart-plus"></i> ${i18n[currentLang].addToCart}
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    };

    window.renderPageContent = window.renderFavoritesPage;
    document.addEventListener("DOMContentLoaded", window.renderFavoritesPage);
  </script>
</body>
</html>
